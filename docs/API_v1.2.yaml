openapi: 3.1.0
info:
  title: PhotoHub API
  version: 1.2.0-draft
  description: |
    HISTORICAL (superseded). The server no longer implements this document:
    every folder and asset route now requires a session and album
    permissions, asset IDs are random, and the unauthenticated
    /api/v1/assets/{assetID}/original|preview routes (which took the SHA-256)
    are REMOVED. The current contract is API_v2.yaml.
    Upload success (200/201) is sent only after the original file and its metadata are
    both durably committed; any other status means nothing was committed and the
    same bytes can be retried.
servers:
  - url: https://photo-hub.example.test
security:
  - bearerAuth: []
paths:
  /api/v1/health:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: Server healthy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /api/v1/folders:
    get:
      summary: List accessible shared folders
      responses:
        '200':
          description: Folder list
          content:
            application/json:
              schema:
                type: object
                properties:
                  folders: {type: array, items: {$ref: '#/components/schemas/Folder'}}
    post:
      summary: Create folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Folder'}
  /api/v1/folders/{folder_id}/assets/check:
    post:
      summary: Optional preflight for known SHA-256 content
      description: Advisory only; authenticated authorization and final server-side hashing are mandatory.
      parameters:
        - $ref: '#/components/parameters/FolderID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hashes]
              properties:
                hashes: {type: array, items: {type: string, pattern: '^[a-f0-9]{64}$'}, maxItems: 100}
      responses:
        '200': {description: Upload/link/already_present recommendation, never final authority}
  /api/v1/folders/{folder_id}/assets:
    post:
      summary: Upload original file into one folder
      parameters:
        - $ref: '#/components/parameters/FolderID'
        - in: header
          name: X-Filename
          schema: {type: string}
        - in: header
          name: X-Content-SHA256
          schema: {type: string, pattern: '^[a-f0-9]{64}$'}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '201':
          description: Created or newly linked, hash verified
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadResult'}
        '200':
          description: Already linked, idempotent result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadResult'}
        '413': {description: File too large}
        '422': {description: Hash mismatch}
        '500':
          description: |
            Server-side write failure (temp_failed, temp_write_failed, file_sync_failed,
            temp_close_failed, storage_failed, metadata_write_failed). Nothing was
            committed; retrying the same bytes is safe.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: |
            Temporarily unable to store; nothing was committed, retry later.
            storage_unavailable = storage volume missing or replaced (restart after
            reconnecting the disk); storage_io_error = the disk reported an I/O error;
            busy = database write lock contention, sent with Retry-After.
          headers:
            Retry-After:
              description: Seconds to wait (only with error busy)
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '507':
          description: |
            insufficient_storage. Refused before the original is stored when the upload
            would leave less than the server's reserve (WITHALBUM_MIN_FREE_BYTES, default
            1 GiB), or the disk became full while storing. Nothing was committed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/folders/{folder_id}/sync:
    get:
      summary: Ordered incremental changes for a folder
      parameters:
        - $ref: '#/components/parameters/FolderID'
        - in: query
          name: cursor
          required: false
          schema: {type: integer, format: int64, minimum: 0, default: 0}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        '200':
          description: Delta page, including tombstones
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeltaPage'}
        '409': {description: Cursor expired; resync full folder snapshot}
  /api/v1/folders/{folder_id}/assets/{asset_id}:
    delete:
      summary: Remove the asset link from one folder (tombstone)
      parameters:
        - $ref: '#/components/parameters/FolderID'
        - $ref: '#/components/parameters/AssetID'
      responses:
        '204': {description: Folder link removed (original retained under retention policy)}
        '403': {description: Forbidden}
  /api/v1/assets/{asset_id}/preview:
    get:
      summary: Fetch mobile preview if ready
      parameters:
        - $ref: '#/components/parameters/AssetID'
      responses:
        '200': {description: Binary image preview}
        '202': {description: Preview processing}
        '404': {description: Asset not found or not accessible}
  /api/v1/assets/{asset_id}/original:
    get:
      summary: Fetch the original asset (range requests planned for large files)
      parameters:
        - $ref: '#/components/parameters/AssetID'
      responses:
        '200': {description: Original bytes}
        '206': {description: Partial original bytes}
        '404': {description: Asset not found or not accessible}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque short-lived access token
  parameters:
    FolderID:
      in: path
      name: folder_id
      required: true
      schema: {type: string}
    AssetID:
      in: path
      name: asset_id
      required: true
      schema: {type: string}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string, description: Machine-readable error code}
    Health:
      type: object
      required: [status, version, storage, integrity]
      properties:
        status: {type: string, enum: [ok]}
        version: {type: string}
        storage:
          type: string
          enum: [ok, unavailable]
          description: unavailable = the storage volume is missing or replaced; writes are refused with 503
        integrity:
          type: string
          enum: [ok, warning]
          description: warning = startup reconciliation found missing or damaged originals or unexpected files (details only in the server log)
    Folder:
      type: object
      required: [id, name, created_at]
      properties:
        id: {type: string}
        name: {type: string}
        created_at: {type: string, format: date-time}
    UploadResult:
      type: object
      required: [result, folder_id, asset_id, sha256, preview_ready]
      properties:
        result: {type: string, enum: [created, linked, already_present]}
        folder_id: {type: string}
        asset_id: {type: string}
        sha256: {type: string}
        preview_ready: {type: boolean}
    SyncEvent:
      type: object
      required: [seq, kind, asset_id, folder_id, occurred_at]
      properties:
        seq: {type: integer, format: int64}
        kind: {type: string, enum: [asset_added, asset_removed, asset_updated]}
        asset_id: {type: string}
        folder_id: {type: string}
        uploader_device_id: {type: string}
        occurred_at: {type: string, format: date-time}
    DeltaPage:
      type: object
      required: [folder_id, events, next_cursor, has_more]
      properties:
        folder_id: {type: string}
        events: {type: array, items: {$ref: '#/components/schemas/SyncEvent'}}
        assets:
          type: object
          additionalProperties:
            type: object
            properties:
              id: {type: string}
              mime_type: {type: string}
              preview_ready: {type: boolean}
        next_cursor: {type: integer, format: int64}
        has_more: {type: boolean}
