openapi: 3.1.0
info:
  title: WithAlbum Self-Hosted Identity and Authorization API
  version: 1.4.2-draft
  description: >-
    Access-control contract. IMPLEMENTED in the Go server: /api/v1/auth/*,
    /api/v1/me*, /api/v1/admin/users* (login, device sessions, account
    administration) and the album routes GET/POST /api/v1/folders,
    GET /api/v1/folders/{folder_id}, POST /api/v1/folders/{folder_id}/assets,
    GET /api/v1/folders/{folder_id}/sync and
    GET /api/v1/folders/{folder_id}/assets/{asset_id}/original|preview.
    Still TARGET DESIGN (marked "not implemented"): folder deletion,
    invitations, membership changes, ownership transfer and the asset list
    (M11/M16). The unauthenticated PoC routes /api/v1/assets/{sha256}/* of
    API_v1.2.yaml are removed. There is no TLS yet (M15): the server listens
    on loopback only.


    Access. Only the dashboard page (GET /), GET /api/v1/health,
    /api/v1/auth/login and /api/v1/auth/refresh work without a session;
    every other path under /api/v1/, including unknown ones, answers 401
    without a valid session. Album routes are authorized on every request
    from the owner and memberships stored at that moment, with
    deny-by-default: a folder the caller neither owns nor is a member of is
    404 folder_not_found, exactly like a folder that does not exist (a
    SERVER_ADMIN is no exception: administrators do not see other people's
    albums); a folder the caller belongs to but whose role does not allow the
    operation is 403 forbidden. Roles: OWNER (everything), CONTRIBUTOR (read
    and upload), VIEWER (read), UPLOADER (upload only: metadata of the
    folder, never its contents). Asset IDs are random and belong to one
    folder: an asset ID used under another folder is 404 asset_not_found.
    Uploads re-check the permission inside the database transaction right
    before the commit, so a permission revoked during an upload is honored.


    Tokens. Login creates one device and one session. The access token
    (opaque, 256-bit random, base64url, 43 characters) is valid 15 minutes;
    the refresh token 30 days, the window restarting at every refresh.
    Refresh rotates BOTH tokens: the previous access and refresh tokens stop
    working immediately. Presenting an already exchanged refresh token again
    revokes the whole session (reuse detection), so clients must never send
    two refreshes with the same token concurrently: serialize refreshes, and
    if a refresh response is lost, log in again. The server stores only
    SHA-256 hashes of tokens.


    Transports. Apps (ios, android, macos) receive the tokens in the JSON
    body and send "Authorization: Bearer <access_token>"; store them in the
    iOS Keychain / Android Keystore-backed storage. Browsers (platform web)
    receive no token in the body: the server sets the HttpOnly cookies
    withalbum_access (Path=/api/) and withalbum_refresh (Path=/api/v1/auth/),
    plus the readable cookie withalbum_csrf, all SameSite=Strict and Secure
    over TLS. A cookie-authenticated request with any method other than
    GET/HEAD/OPTIONS must send the CSRF token in X-CSRF-Token (403
    csrf_failed otherwise). When an Authorization header is present, cookies
    are ignored. Request bodies must be application/json (415 otherwise).


    Every authenticated request re-reads the account: disabling it, revoking
    the device, a password reset or change (other sessions) take effect on
    the next request (401); role and album-creation changes too.


    Errors are {"error": "<code>"}. 401 responses carry
    WWW-Authenticate: Bearer. Responses of these routes are Cache-Control:
    no-store.
servers:
  - url: http://127.0.0.1:8787
    description: Current development server (loopback only)
  - url: https://withalbum-server.local.example
    description: Target (TLS, M15)
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - name: Auth
  - name: Me
  - name: Server Admin
  - name: Albums
  - name: Invitations
  - name: Assets
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Authenticate and create a device session (rate-limited)
      description: >-
        Every credential failure (unknown account, wrong password, disabled
        account, account without a usable password) returns the same 401
        body after the same Argon2id work, and is recorded in the audit log
        (never the password). Rate limits (in memory, per server process):
        10 attempts per client IP then 1 every 6 s; 5 failures per account
        and IP and 20 per account from any IP within 15 minutes block that
        account (also accounts that do not exist) until the window ends. At
        most 2 password hashes are computed at once; a request that waits
        longer than 5 s for one gets 503 busy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_name, password, device_name, platform]
              properties:
                login_name: {type: string, description: case-insensitive}
                password: {type: string, format: password}
                device_name: {type: string, minLength: 1, maxLength: 64, description: 'shown in the device list; no control characters or surrounding spaces'}
                platform: {type: string, enum: [ios, android, macos, web]}
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400': {description: 'invalid_json, invalid_request (empty login or password), invalid_device'}
        '401': {description: invalid_credentials}
        '415': {description: json_required}
        '429':
          description: rate_limited
          headers:
            Retry-After: {schema: {type: integer}, description: seconds}
        '503':
          description: busy (no password hashing slot free), retry after Retry-After seconds
          headers:
            Retry-After: {schema: {type: integer}}
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Rotate the refresh token and issue a new access token
      description: >-
        Apps send the refresh token in the body. Browsers send {} with the
        withalbum_refresh cookie and the X-CSRF-Token header; the CSRF token
        is rotated as well. An already used refresh token revokes the
        session (401).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: {type: string, description: 'required unless sent as the cookie'}
      responses:
        '200':
          description: Rotated credentials (same device_id)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '401': {description: 'unauthorized: expired, revoked, unknown or reused refresh token, or account disabled'}
        '403': {description: 'csrf_failed (cookie refresh without a valid X-CSRF-Token; nothing changed)'}
        '415': {description: json_required}
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current device and its session
      responses:
        '204': {description: Revoked (browser cookies cleared)}
        '401': {description: unauthorized}
        '403': {description: csrf_failed}
  /api/v1/me:
    get:
      tags: [Me]
      summary: Current account and device
      responses:
        '200':
          description: The account as stored now
          content:
            application/json:
              schema:
                type: object
                required: [user, device_id, platform]
                properties:
                  user: {$ref: '#/components/schemas/User'}
                  device_id: {type: string}
                  platform: {type: string, enum: [ios, android, macos, web]}
        '401': {description: unauthorized}
  /api/v1/me/password:
    post:
      tags: [Me]
      summary: Change own password; signs out every other device
      description: Rate-limited like login. The current session stays valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: {type: string, format: password}
                new_password: {type: string, format: password, description: '12+ characters, at most 1024 bytes, no NUL or line breaks'}
      responses:
        '204': {description: Changed}
        '400': {description: 'invalid_password (policy; body has a "message")'}
        '401': {description: unauthorized}
        '403': {description: 'invalid_credentials (wrong current password) or csrf_failed'}
        '429': {description: rate_limited}
        '503': {description: busy}
  /api/v1/me/devices:
    get:
      tags: [Me]
      summary: Own devices with a live session, newest first
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: {$ref: '#/components/schemas/Device'}
        '401': {description: unauthorized}
  /api/v1/me/devices/{device_id}:
    delete:
      tags: [Me]
      summary: Revoke one of the own devices (may be the current one)
      parameters:
        - in: path
          name: device_id
          required: true
          schema: {type: string}
      responses:
        '204': {description: Revoked; its tokens are refused from now on}
        '401': {description: unauthorized}
        '403': {description: csrf_failed}
        '404': {description: 'device_not_found (not own, or already revoked)'}
  /api/v1/admin/users:
    post:
      tags: [Server Admin]
      summary: Create an active account (SERVER_ADMIN only)
      description: >-
        The administrator sets the initial password and hands it over out of
        band. The first administrator can only be set up at the server
        console (withalbum-server admin init), never over HTTP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_name, password]
              properties:
                login_name: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{2,31}$'}
                display_name: {type: string, description: 'default: login_name'}
                password: {type: string, format: password}
                server_role: {type: string, enum: [USER, SERVER_ADMIN], default: USER}
                can_create_albums: {type: boolean, default: false}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUser'}
        '400': {description: 'invalid_login_name, invalid_display_name, invalid_role, invalid_password'}
        '401': {description: unauthorized}
        '403': {description: 'forbidden (not SERVER_ADMIN) or csrf_failed'}
        '409': {description: login_taken}
    get:
      tags: [Server Admin]
      summary: List server accounts (SERVER_ADMIN only)
      responses:
        '200':
          description: Account list
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: {$ref: '#/components/schemas/AdminUser'}
        '401': {description: unauthorized}
        '403': {description: forbidden}
  /api/v1/admin/users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserID'
    get:
      tags: [Server Admin]
      summary: Get one account (SERVER_ADMIN only)
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUser'}
        '403': {description: forbidden}
        '404': {description: user_not_found}
    patch:
      tags: [Server Admin]
      summary: Enable or disable an account (SERVER_ADMIN only)
      description: Disabling revokes every session of the account at once; enabling does not restore them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [active, disabled]}
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUser'}
        '400': {description: invalid_status}
        '403': {description: 'forbidden or csrf_failed'}
        '404': {description: user_not_found}
        '409': {description: 'last_admin (last usable SERVER_ADMIN), owns_albums (transfer albums first), not_initialized'}
  /api/v1/admin/users/{user_id}/permissions:
    patch:
      tags: [Server Admin]
      summary: Change server role and/or album creation permission (SERVER_ADMIN only)
      description: Both given fields change in one transaction, or neither. Applies to the account's next request.
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                server_role: {type: string, enum: [USER, SERVER_ADMIN]}
                can_create_albums: {type: boolean}
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUser'}
        '400': {description: 'invalid_request (no field), invalid_role'}
        '403': {description: 'forbidden or csrf_failed'}
        '404': {description: user_not_found}
        '409': {description: 'last_admin, not_initialized'}
  /api/v1/folders:
    post:
      tags: [Albums]
      summary: Create a folder; the authenticated creator becomes its only owner
      description: >-
        Requires SERVER_ADMIN or can_create_albums=true (checked on the
        request and again inside the transaction); membership never
        authorizes creation. Cookie sessions need X-CSRF-Token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 80, description: 'trimmed; 1-80 characters'}
      responses:
        '201':
          description: Created; role OWNER
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Folder'}
        '400': {description: 'invalid_json, invalid_folder_name'}
        '401': {description: unauthorized}
        '403': {description: 'forbidden (no album-creation permission) or csrf_failed'}
        '503': {description: 'storage_unavailable, busy'}
        '507': {description: insufficient_storage}
    get:
      tags: [Albums]
      summary: List only the folders the caller owns or is a member of
      responses:
        '200':
          description: Own and shared folders with the caller's role, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [folders]
                properties:
                  folders:
                    type: array
                    items: {$ref: '#/components/schemas/Folder'}
        '401': {description: unauthorized}
  /api/v1/folders/{folder_id}:
    parameters:
      - $ref: '#/components/parameters/FolderID'
    get:
      tags: [Albums]
      summary: Minimal metadata for the owner and any member, UPLOADER included
      responses:
        '200':
          description: Folder name, own role and what it allows
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Folder'}
        '401': {description: unauthorized}
        '404': {description: 'folder_not_found (unknown, or not owner/member)'}
    delete:
      tags: [Albums]
      summary: Delete or archive album (OWNER only) - not implemented
      responses:
        '204': {description: Archived/deleted under retention policy}
        '403': {description: Not owner}
  /api/v1/folders/{folder_id}/invitations:
    post:
      tags: [Invitations]
      summary: Invite a registered user, OWNER only - not implemented (M11)
      description: Target must be an existing approved server account; cannot auto-create an unapproved account.
      parameters:
        - $ref: '#/components/parameters/FolderID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invited_user_id, role]
              properties:
                invited_user_id: {type: string}
                role: {type: string, enum: [VIEWER, UPLOADER, CONTRIBUTOR]}
      responses:
        '201': {description: Pending invitation created}
        '403': {description: Not owner}
        '404': {description: Invitee not eligible or album not accessible}
  /api/v1/invitations:
    get:
      tags: [Invitations]
      summary: List pending invitations addressed to current account - not implemented (M11)
      responses:
        '200': {description: Own invitations only}
  /api/v1/invitations/{invitation_id}/accept:
    post:
      tags: [Invitations]
      summary: Accept a valid invitation as its named recipient - not implemented (M11)
      parameters:
        - $ref: '#/components/parameters/InvitationID'
      responses:
        '200': {description: Membership created atomically}
        '403': {description: Invitee mismatch or not eligible}
        '410': {description: Invite expired or revoked}
  /api/v1/folders/{folder_id}/members/{user_id}:
    patch:
      tags: [Albums]
      summary: Change member role (OWNER only) - not implemented (M11)
      parameters:
        - $ref: '#/components/parameters/FolderID'
        - $ref: '#/components/parameters/UserID'
      responses:
        '200': {description: Role changed; next requests use new authorization}
        '403': {description: Not owner}
    delete:
      tags: [Albums]
      summary: Remove member (OWNER only) - not implemented (M11)
      parameters:
        - $ref: '#/components/parameters/FolderID'
        - $ref: '#/components/parameters/UserID'
      responses:
        '204': {description: Member removed}
        '403': {description: Not owner}
  /api/v1/folders/{folder_id}/owner:
    post:
      tags: [Albums]
      summary: Transfer unique ownership to active user atomically - not implemented (M11)
      parameters:
        - $ref: '#/components/parameters/FolderID'
      responses:
        '200': {description: Ownership transferred and audited}
        '403': {description: Not owner}
  /api/v1/folders/{folder_id}/assets:
    parameters:
      - $ref: '#/components/parameters/FolderID'
    get:
      tags: [Assets]
      summary: List photo assets (OWNER, VIEWER, CONTRIBUTOR) - not implemented, use /sync
      responses:
        '200': {description: Authorized assets, paginated}
        '403': {description: UPLOADER cannot list files}
    post:
      tags: [Assets]
      summary: Upload one original as the request body (OWNER, CONTRIBUTOR, UPLOADER)
      description: >-
        Whole file in one request, at most 512 MiB. Headers: X-Filename
        (percent-encoded allowed), X-Device-ID (free-form label, at most 100
        bytes), X-Content-SHA256 (optional; 422 on mismatch). Cookie sessions
        need X-CSRF-Token. Success is sent only after the original file and
        its metadata are durably committed; any other status means nothing
        was committed and the same bytes can be retried. The permission is
        checked again right before the commit; if it was revoked meanwhile the
        upload is refused (403/404) and nothing is recorded.


        Callers who can read the folder (OWNER, CONTRIBUTOR) get 201
        created or 200 already_present (the folder already holds these
        bytes) with the folder's asset ID. Whether the bytes are stored for
        another folder is never revealed (both are 201 created, and the
        folder gets an asset of its own). An UPLOADER always gets the same
        202 receipt, which only repeats what the client sent; it never says
        whether the bytes were new or already there.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: already_present (readers only)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadResult'}
        '201':
          description: created (readers only)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadResult'}
        '202':
          description: Generic receipt for upload-only callers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadReceipt'}
        '400': {description: 'empty_file, upload_failed, invalid_device_id'}
        '401': {description: unauthorized}
        '403': {description: 'forbidden (VIEWER, or role lowered during the upload) or csrf_failed'}
        '404': {description: 'folder_not_found (not owner/member, or membership removed during the upload)'}
        '413': {description: file_too_large}
        '422': {description: hash_mismatch}
        '500': {description: 'temp_failed, temp_close_failed, temp_write_failed, file_sync_failed, storage_failed, metadata_write_failed'}
        '503':
          description: 'storage_unavailable, storage_io_error, busy (Retry-After: 1)'
        '507': {description: insufficient_storage (do not retry automatically)}
  /api/v1/folders/{folder_id}/sync:
    get:
      tags: [Assets]
      summary: Read the incremental change feed (OWNER, VIEWER, CONTRIBUTOR only)
      parameters:
        - $ref: '#/components/parameters/FolderID'
        - in: query
          name: cursor
          schema: {type: integer, minimum: 0, default: 0}
          description: last seq already applied; at most 100 events per page
      responses:
        '200':
          description: Events after the cursor and the assets they reference
          content:
            application/json:
              schema:
                type: object
                required: [folder_id, events, assets, next_cursor, has_more]
                properties:
                  folder_id: {type: string}
                  events:
                    type: array
                    items:
                      type: object
                      required: [seq, kind, asset_id, folder_id, uploader_device_id, occurred_at]
                      properties:
                        seq: {type: integer}
                        kind: {type: string, enum: [asset_added]}
                        asset_id: {type: string}
                        folder_id: {type: string}
                        uploader_device_id: {type: string}
                        occurred_at: {type: string}
                  assets:
                    type: object
                    description: by asset id
                    additionalProperties: {$ref: '#/components/schemas/Asset'}
                  next_cursor: {type: integer}
                  has_more: {type: boolean}
        '400': {description: invalid_cursor}
        '401': {description: unauthorized}
        '403': {description: forbidden (UPLOADER)}
        '404': {description: folder_not_found}
  /api/v1/folders/{folder_id}/assets/{asset_id}/original:
    get:
      tags: [Assets]
      summary: Download the original; the asset must be linked to this folder
      parameters:
        - $ref: '#/components/parameters/FolderID'
        - $ref: '#/components/parameters/AssetID'
      responses:
        '200': {description: 'Original bytes (Content-Type as sniffed at upload, Range supported, Cache-Control: no-store)'}
        '401': {description: unauthorized}
        '403': {description: 'forbidden (UPLOADER; the same answer for any asset id)'}
        '404': {description: 'folder_not_found, asset_not_found (unknown, or an asset of another folder)'}
  /api/v1/folders/{folder_id}/assets/{asset_id}/preview:
    get:
      tags: [Assets]
      summary: Download the JPEG preview, same access as the original
      parameters:
        - $ref: '#/components/parameters/FolderID'
        - $ref: '#/components/parameters/AssetID'
      responses:
        '200': {description: JPEG preview, longer side at most 1600 px}
        '401': {description: unauthorized}
        '403': {description: forbidden (UPLOADER)}
        '404': {description: 'folder_not_found, asset_not_found, preview_not_ready'}
components:
  parameters:
    FolderID:
      in: path
      name: folder_id
      required: true
      schema: {type: string}
    UserID:
      in: path
      name: user_id
      required: true
      schema: {type: string}
    AssetID:
      in: path
      name: asset_id
      required: true
      schema: {type: string}
    InvitationID:
      in: path
      name: invitation_id
      required: true
      schema: {type: string}
  schemas:
    Folder:
      type: object
      required: [id, name, created_at, role, can_read, can_upload]
      properties:
        id: {type: string}
        name: {type: string}
        created_at: {type: string}
        role: {type: string, enum: [OWNER, CONTRIBUTOR, VIEWER, UPLOADER]}
        can_read: {type: boolean, description: 'may list, sync and download'}
        can_upload: {type: boolean}
    Asset:
      type: object
      required: [id, sha256, filename, mime_type, bytes, preview_ready, uploaded_at]
      properties:
        id: {type: string, description: 'random; valid only under its folder'}
        sha256: {type: string, description: 'of the original, to verify a download'}
        filename: {type: string}
        mime_type: {type: string}
        bytes: {type: integer}
        preview_ready: {type: boolean}
        uploaded_at: {type: string}
    UploadResult:
      type: object
      required: [result, asset_id, folder_id, sha256, preview_ready]
      properties:
        result: {type: string, enum: [created, already_present]}
        asset_id: {type: string}
        folder_id: {type: string}
        sha256: {type: string}
        preview_ready: {type: boolean}
    UploadReceipt:
      type: object
      required: [result, folder_id, sha256, bytes]
      properties:
        result: {type: string, enum: [accepted]}
        folder_id: {type: string}
        sha256: {type: string, description: 'of the bytes the client sent'}
        bytes: {type: integer, description: 'size of the bytes the client sent'}
    User:
      type: object
      required: [user_id, login_name, display_name, server_role, can_create_albums]
      properties:
        user_id: {type: string}
        login_name: {type: string}
        display_name: {type: string}
        server_role: {type: string, enum: [SERVER_ADMIN, USER]}
        can_create_albums: {type: boolean}
    AdminUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [status, created_at, password_locked]
          properties:
            status: {type: string, enum: [active, disabled]}
            created_at: {type: string}
            password_locked: {type: boolean, description: 'true: cannot log in (bootstrap account before admin init)'}
    TokenResponse:
      type: object
      required: [token_type, device_id, access_expires_at, refresh_expires_at, user]
      properties:
        token_type: {type: string, enum: [Bearer, cookie], description: 'cookie for platform web'}
        access_token: {type: string, description: 'apps only'}
        refresh_token: {type: string, description: 'apps only'}
        csrf_token: {type: string, description: 'web only; also in the withalbum_csrf cookie'}
        access_expires_at: {type: string, format: date-time}
        refresh_expires_at: {type: string, format: date-time}
        device_id: {type: string}
        user: {$ref: '#/components/schemas/User'}
    Device:
      type: object
      required: [device_id, device_name, platform, created_at, last_used_at, expires_at, current]
      properties:
        device_id: {type: string}
        device_name: {type: string}
        platform: {type: string, enum: [ios, android, macos, web]}
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time, description: last login or refresh}
        expires_at: {type: string, format: date-time, description: end of the refresh window}
        current: {type: boolean, description: the device of this request}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque access token (15 minutes)
    cookieAuth:
      type: apiKey
      in: cookie
      name: withalbum_access
      description: Browsers only; unsafe methods also need the X-CSRF-Token header.
