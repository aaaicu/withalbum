# GoReleaser v2. Pre-release builds of an experimental self-hosted server:
# every GitHub release is a prerelease and starts as a draft (see
# docs/RELEASING.md). scripts/release-dryrun.sh builds the same archives
# without GoReleaser and reads the archive file list below; keep the
# "files:" entries plain paths or globs (no src/dst).
version: 2
project_name: withalbum-server
before:
  hooks:
    # Release archives carry the license files of every linked Go module.
    - bash scripts/third-party-licenses.sh --check
builds:
  - id: withalbum-server
    main: ./server
    binary: withalbum-server
    env:
      - CGO_ENABLED=0
    targets:
      - darwin_arm64
      - darwin_amd64_v1
      - linux_amd64_v1
      - linux_arm64
      - linux_arm_7
    flags:
      - -trimpath
    # -version prints "withalbum-server <version>": the tag without the
    # leading "v" (tag v0.1.0-alpha.1 -> 0.1.0-alpha.1), as in archive names.
    ldflags:
      - -s -w -X main.version={{.Version}}
    mod_timestamp: '{{ .CommitTimestamp }}'
archives:
  - id: withalbum-archives
    formats: [tar.gz]
    name_template: "withalbum-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    format_overrides:
      - goos: darwin
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md
      - SECURITY.md
      - docs/INSTALL_MACOS.md
      - docs/INSTALL_LINUX.md
      - docs/BACKUP_RESTORE.md
      - docs/MACMINI_E2E_CHECKLIST.md
      - docs/OPEN_SOURCE_DECISIONS.md
      - scripts/install-macos.sh
      - scripts/install-linux.sh
      - third_party/**/*
checksum:
  name_template: checksums.txt
  algorithm: sha256
changelog:
  # Release notes come from docs/releases/<tag>.md (--release-notes in
  # .github/workflows/release.yml); this list is not used then.
  use: git
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
release:
  # Never a full release: there is no 1.0 and no signed installer.
  prerelease: "true"
  draft: true
