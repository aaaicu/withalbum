<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>WithAlbum Server — 로컬 관리</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f8fb; color: #172234; }
    main { max-width: 900px; margin: 0 auto; padding: 32px 20px 72px; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .mark { background: #1d4ed8; border-radius: 12px; display: grid; place-items: center; color: white; font-size: 22px; width: 44px; height: 44px; }
    h1 { font-size: 29px; margin: 0; letter-spacing: -.7px; }
    .sub { color: #58667b; margin: 5px 0 28px; }
    .warning { background: #fff8e8; border: 1px solid #f7d68c; color: #875a00; padding: 16px; border-radius: 12px; line-height: 1.6; margin-bottom: 26px; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; }
    section { background: white; border: 1px solid #e1e7f0; padding: 21px; border-radius: 16px; box-shadow: 0 2px 7px #18233c08; }
    section h2 { font-size: 15px; color: #657387; margin: 0 0 14px; font-weight: 600; }
    .value { font-size: 23px; font-weight: 750; }
    .wide { margin-top: 18px; }
    .field { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 16px; }
    input, select { min-width: 0; border-radius: 9px; border: 1px solid #ccd5e3; padding: 11px 12px; background: white; color: #172234; }
    input[type="text"] { flex: 1 1 180px; }
    button { background: #1d4ed8; color: white; padding: 11px 16px; border: 0; border-radius: 9px; cursor: pointer; font-weight: 650; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    ul { padding-left: 18px; line-height: 1.8; }
    .muted, small { color: #6f7c90; }
    .status { margin: 15px 0 0; min-height: 1.5rem; }
    code { font-size: 13px; background: #edf1f7; border-radius: 5px; padding: 3px 6px; word-break: break-all; }
    @media (max-width: 680px) { .cards { grid-template-columns: 1fr; } h1 { font-size: 25px; } }
    @media (prefers-color-scheme: dark) {
      body { background: #0f1725; color: #e8edf5; }
      .sub, .muted, section h2, small { color: #9daec5; }
      section { background: #192438; border-color: #31435d; }
      .warning { background: #3c3219; color: #ffe6ab; border-color: #a4781e; }
      input, select { background: #101b2e; color: #e8edf5; border-color: #3c506a; }
      code { background: #2c3a50; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true">▧</span><div><h1>WithAlbum Server</h1><div class="sub">내 컴퓨터에서 직접 운영하는 사진 서버</div></div></div>
    <div class="warning"><strong>개발 중 · 로컬 실험용</strong><div>아직 인증, 사용자 권한, 데이터 복구 체계가 완성되지 않았습니다. 중요한 사진의 유일한 보관 장소로 사용하거나 인터넷에 공개하지 마세요.</div></div>
    <div class="cards">
      <section><h2>서버 상태</h2><div class="value" id="health">확인 중</div></section>
      <section><h2>서버 버전</h2><div class="value" id="version">-</div></section>
      <section><h2>공유 폴더</h2><div class="value" id="count">-</div></section>
    </div>
    <section class="wide"><h2>공유 폴더 관리</h2><div class="muted">시험용 폴더를 생성하고 파일을 서버에 업로드할 수 있습니다.</div>
      <form id="create" class="field"><input id="folderName" type="text" maxlength="80" placeholder="예: 가족여행" required><button>폴더 만들기</button></form>
      <ul id="folders"><li>로딩 중...</li></ul>
    </section>
    <section class="wide"><h2>파일 업로드 테스트</h2><div class="field"><select id="folderSelect" aria-label="대상 폴더"><option value="">폴더 선택</option></select><input id="file" type="file" accept="image/*,video/*" aria-label="파일 선택"><button id="upload" type="button">업로드</button></div><div class="status" id="feedback" role="status" aria-live="polite"></div></section>
    <p class="muted"><small>인터넷 공개 및 실제 서비스 용도가 아닌, 서버 기능과 배포 방식 검증을 위한 첫 단계입니다.</small></p>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    async function api(url, opts = {}) {
      const response = await fetch(url, {cache: 'no-store', ...opts});
      const body = await response.json();
      if (!response.ok) throw Error(body.error || '서버 오류');
      return body;
    }
    async function reload() {
      try {
        const [health, folders] = await Promise.all([api('/api/v1/health'), api('/api/v1/folders')]);
        $('health').textContent = health.status === 'ok' ? '정상 실행' : '점검 필요';
        $('version').textContent = health.version;
        $('count').textContent = folders.folders.length + '개';
        $('folders').replaceChildren();
        $('folderSelect').replaceChildren(new Option('폴더 선택', ''));
        if (!folders.folders.length) $('folders').appendChild(Object.assign(document.createElement('li'), {textContent: '아직 폴더가 없습니다.'}));
        folders.folders.sort((a,b) => a.name.localeCompare(b.name, 'ko')).forEach(folder => {
          const li = document.createElement('li');
          li.textContent = folder.name + '  ';
          const small = document.createElement('small');
          small.textContent = `(${folder.id.slice(0,8)})`;
          li.appendChild(small);
          $('folders').appendChild(li);
          $('folderSelect').appendChild(new Option(folder.name, folder.id));
        });
      } catch (err) { $('health').textContent = '연결 오류'; $('feedback').textContent = err.message; }
    }
    $('create').addEventListener('submit', async e => {
      e.preventDefault();
      const name = $('folderName').value.trim();
      if (!name) return;
      try {
        await api('/api/v1/folders', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name})});
        $('folderName').value = '';
        $('feedback').textContent = '폴더를 만들었습니다.';
        await reload();
      } catch(err) { $('feedback').textContent = err.message; }
    });
    $('upload').addEventListener('click', async () => {
      const file = $('file').files[0], folder = $('folderSelect').value;
      if (!folder || !file) { $('feedback').textContent = '폴더와 파일을 선택해 주세요.'; return; }
      const button = $('upload'); button.disabled = true;
      $('feedback').textContent = '업로드 중 (최대 512MB)...';
      try {
        const result = await api(`/api/v1/folders/${encodeURIComponent(folder)}/assets`, {method:'POST', headers:{'Content-Type':'application/octet-stream','X-Filename': encodeURIComponent(file.name)}, body: file});
        $('feedback').textContent = `${result.result === 'already_present' ? '이미 저장된 파일입니다.' : '업로드 완료.'} 해시: ${result.sha256.slice(0,16)}…`;
        $('file').value = '';
      } catch(err) { $('feedback').textContent = '업로드 실패: ' + err.message; }
      finally { button.disabled = false; }
    });
    reload();
  </script>
</body>
</html>
